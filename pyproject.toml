[project]
name = "voice-agent"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "livekit-api>=1.2.2",
    "pipecat-ai[deepgram,groq,livekit,silero,websocket]>=1.15.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sherpa-onnx>=2.0.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
# Production entrypoints (each runs as a separate process)
va-supervisor = "app.worker.supervisor:supervisor_entry"
va-worker = "app.worker.worker:worker_entry"
va-postcall = "app.postcall.processor:postcall_entry"

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "redislite>=6.2.912183",
]
