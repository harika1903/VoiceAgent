<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Agent</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  button { font-size: 1.1rem; padding: .7rem 1.6rem; border-radius: 8px; border: 0; cursor: pointer; }
  #start { background: #2563eb; color: #fff; } #stop { background: #dc2626; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  #status { margin: 1rem 0 .3rem; color: #555; } #mic { font-size: .85rem; color: #555; margin-bottom: .3rem; }
  #log { background: #111; color: #9f9; padding: 1rem; border-radius: 8px; height: 220px; overflow: auto;
         font: 13px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
  input { padding: .4rem; }
</style>
</head>
<body>
<h1>Voice Agent</h1>
<p>Use <b>headphones</b> (otherwise the agent hears itself through your speakers).</p>
<p>Agent id: <input id="agent" value="default"></p>
<p><label><input type="checkbox" id="dsp"> Browser noise suppression + auto-gain (try toggling if the agent can't understand you)</label></p>
<button id="start">Start call</button> <button id="stop" disabled>End call</button>
<div id="status">idle</div>
<div id="mic">mic: -</div>
<div style="background:#ddd;height:10px;border-radius:5px;overflow:hidden;margin-bottom:.5rem"><div id="lvl" style="height:100%;width:0;background:#16a34a"></div></div>
<div id="log"></div>

<script>
const RATE = 16000;                 // must match server pipeline_sample_rate
let ws, ctx, micStream, node, nextPlayTime = 0, playing = new Set();
const $ = id => document.getElementById(id);
const log = m => { $('log').textContent += m + '\n'; $('log').scrollTop = 1e9; };

// AudioWorklet runs on the audio thread. It receives mic audio at the device's
// native rate (often 48 kHz), downsamples to 16 kHz, converts float -> int16,
// and posts ~20 ms chunks to the main thread.
const workletSrc = `
class Capture extends AudioWorkletProcessor {
  constructor() { super(); this.buf = []; this.ratio = sampleRate / ${RATE}; this.pos = 0; }
  process(inputs) {
    const ch = inputs[0][0]; if (!ch) return true;
    // naive decimation with box-averaging (good enough for speech)
    for (; this.pos < ch.length; this.pos += this.ratio) {
      const i = Math.floor(this.pos), j = Math.min(ch.length, Math.floor(this.pos + this.ratio));
      let s = 0; for (let k = i; k < j; k++) s += ch[k];
      this.buf.push(s / Math.max(1, j - i));
    }
    this.pos -= ch.length;
    if (this.buf.length >= 320) {                      // 320 samples = 20 ms @ 16 kHz
      const out = new Int16Array(this.buf.length);
      for (let k = 0; k < out.length; k++) out[k] = Math.max(-1, Math.min(1, this.buf[k])) * 32767;
      this.port.postMessage(out.buffer, [out.buffer]); this.buf = [];
    }
    return true;
  }
}
registerProcessor('capture', Capture);`;

async function start() {
  $('start').disabled = true; $('status').textContent = 'connecting...';
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true,
             // Browser "enhancement" can mangle a noisy laptop mic into mush that speech
             // recognition can't read, so it's opt-in. Echo cancellation stays on.
             noiseSuppression: $('dsp').checked, autoGainControl: $('dsp').checked } });
  ctx = new AudioContext();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([workletSrc], { type: 'text/javascript' })));
  node = new AudioWorkletNode(ctx, 'capture');
  ctx.createMediaStreamSource(micStream).connect(node);

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/web?agent_id=${encodeURIComponent($('agent').value)}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { $('status').textContent = 'connected - talk!'; $('stop').disabled = false; log('connected'); };
  ws.onclose = e => { log(`closed (${e.code} ${e.reason})`); cleanup(); };
  ws.onmessage = e => typeof e.data === 'string' ? onControl(JSON.parse(e.data)) : playPcm(e.data);
  const label = micStream.getAudioTracks()[0].label; $('mic').textContent = 'mic: ' + label;
  log('using mic: ' + label + ' | noise-suppression/AGC: ' + ($('dsp').checked ? 'on' : 'off'));
  let peakSeen = 0, t0 = Date.now(), warned = false;
  node.port.onmessage = e => {
    if (ws.readyState === 1) ws.send(e.data);
    // live level meter + silent-mic detector (a muted/wrong input device sends pure zeros)
    const a = new Int16Array(e.data); let pk = 0; for (let i = 0; i < a.length; i += 8) pk = Math.max(pk, Math.abs(a[i]));
    peakSeen = Math.max(peakSeen, pk); $('lvl').style.width = Math.min(100, pk / 200) + '%';
    if (!warned && Date.now() - t0 > 4000 && peakSeen < 150) {
      warned = true; log('WARNING: mic is silent. Wrong or muted input device? Check system sound settings / browser site settings.');
      $('status').textContent = 'MIC SILENT - check input device'; $('status').style.color = '#dc2626';
    }
  };
}

function onControl(msg) {
  if (msg.type === 'gate') {             // speaker-lock decisions from the server
    const sc = msg.score == null ? '' : ` (score ${msg.score})`;
    if (msg.event === 'enrolled') { log('🔒 your voice is registered - other voices will be ignored'); $('status').textContent = 'voice registered - only you can interrupt'; }
    else if (msg.event.startsWith('blocked')) log('🚫 ignored another voice / noise' + sc);
    else if (msg.event.startsWith('close')) log('🚫 another speaker took over - ignoring' + sc);
    return;
  }
  if (msg.type === 'clear') {            // barge-in: user interrupted, drop queued agent audio
    playing.forEach(s => { try { s.stop(); } catch {} }); playing.clear();
    nextPlayTime = 0; log('(interrupted)');
  }
}

function playPcm(buf) {
  const i16 = new Int16Array(buf, 0, buf.byteLength >> 1);
  const f32 = Float32Array.from(i16, v => v / 32768);
  const ab = ctx.createBuffer(1, f32.length, RATE); ab.copyToChannel(f32, 0);
  const src = ctx.createBufferSource(); src.buffer = ab; src.connect(ctx.destination);
  // Schedule chunks back-to-back so network jitter doesn't cause gaps/clicks.
  const t = Math.max(ctx.currentTime + 0.05, nextPlayTime);
  src.start(t); nextPlayTime = t + ab.duration;
  playing.add(src); src.onended = () => playing.delete(src);
}

function cleanup() {
  micStream?.getTracks().forEach(t => t.stop()); ctx?.close(); node = ctx = ws = null;
  $('start').disabled = false; $('stop').disabled = true; $('status').textContent = 'idle'; $('status').style.color = ''; $('lvl').style.width = '0'; nextPlayTime = 0;
}
$('start').onclick = () => start().catch(e => { log('error: ' + e.message); cleanup(); });
$('stop').onclick = () => ws?.close();
</script>
</body>
</html>
